name: Deploy

# Manual only — this touches a live Marzban panel and real billing data, so a
# push to main never deploys by itself. Trigger from the Actions tab, or:
#   gh workflow run deploy.yml --ref main
on:
  workflow_dispatch:

jobs:
  # D18 (2026-09-27): without the four DEPLOY_* secrets this workflow used to
  # fail red halfway through the SSH step, which read as "deploy broke" when
  # the real answer was "deploy was never configured". The gate below turns
  # that into a green no-op with an explicit notice. Decided against deleting
  # the workflow (deploys-per-UI are a real fallback if SSH-from-laptop is
  # ever unavailable) and against hard-failing (a manual-only path nobody has
  # configured yet is not an incident).
  secrets-gate:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          H: ${{ secrets.DEPLOY_HOST }}
          U: ${{ secrets.DEPLOY_USER }}
          K: ${{ secrets.DEPLOY_SSH_KEY }}
          P: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$H" ] && [ -n "$U" ] && [ -n "$K" ] && [ -n "$P" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PATH are not set on this repo — skipping the deploy. Set them under Settings → Secrets and variables → Actions to enable this workflow, or deploy from the server per README ('Deployment')."
          fi

  deploy:
    needs: secrets-gate
    if: needs.secrets-gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # A copy of the database BEFORE anything changes. Migrations run on
            # startup and are one-way; without this, a bad deploy leaves the
            # only copy of the billing data already migrated. Kept on the
            # server, 10 most recent, so a rollback has something to restore.
            mkdir -p ./predeploy-backups
            if docker compose ps -q backend > /dev/null 2>&1; then
              stamp=$(date +%Y%m%d-%H%M%S)
              docker compose cp backend:/app/data/vpn.db "./predeploy-backups/vpn-$stamp.db" ||                 echo "WARNING: could not copy the database - continuing, but there is no pre-deploy backup"
              ls -1t ./predeploy-backups/vpn-*.db 2>/dev/null | tail -n +11 | xargs -r rm --
            fi

            git pull origin main
            docker compose up -d --build
