name: Deploy

# Manual only — this touches a live Marzban panel and real billing data, so a
# push to main never deploys by itself. Trigger from the Actions tab, or:
#   gh workflow run deploy.yml --ref main
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # A copy of the database BEFORE anything changes. Migrations run on
            # startup and are one-way; without this, a bad deploy leaves the
            # only copy of the billing data already migrated. Kept on the
            # server, 10 most recent, so a rollback has something to restore.
            mkdir -p ./predeploy-backups
            if docker compose ps -q backend > /dev/null 2>&1; then
              stamp=$(date +%Y%m%d-%H%M%S)
              docker compose cp backend:/app/data/vpn.db "./predeploy-backups/vpn-$stamp.db" ||                 echo "WARNING: could not copy the database - continuing, but there is no pre-deploy backup"
              ls -1t ./predeploy-backups/vpn-*.db 2>/dev/null | tail -n +11 | xargs -r rm --
            fi

            git pull origin main
            docker compose up -d --build
