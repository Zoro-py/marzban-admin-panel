name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - name: Import check
        env:
          MARZBAN_BASE_URL: http://localhost
          MARZBAN_USERNAME: ci
          MARZBAN_PASSWORD: ci
        run: python -c "import app.main"
      # The tests are standalone scripts (python -m tests.<name>) on purpose —
      # see tests/test_bulk_accounts.py's docstring. Every one must exit 0.
      - name: Run backend tests
        env:
          MARZBAN_BASE_URL: https://panel.test
          MARZBAN_USERNAME: ci
          MARZBAN_PASSWORD: ci
        run: |
          fails=0
          for f in tests/test_*.py; do
            mod="${f%.py}"; mod="${mod//\//.}"
            echo "::group::$mod"
            python -m "$mod" || fails=$((fails+1))
            echo "::endgroup::"
          done
          exit $fails

  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - name: Import check
        env:
          BOT_TOKEN: "123:ci"
          ADMIN_CHAT_ID: "123456789"
          API_BASE_URL: http://localhost:8000
          MARZBAN_USERNAME: ci
          MARZBAN_PASSWORD: ci
        run: python -c "import bot"
      - name: Run bot tests
        env:
          BOT_TOKEN: "123:ci"
          ADMIN_CHAT_ID: "123456789"
          API_BASE_URL: http://localhost:8000
          MARZBAN_USERNAME: ci
          MARZBAN_PASSWORD: ci
        run: |
          fails=0
          for f in test_*.py; do
            mod="${f%.py}"
            echo "::group::$mod"
            python -m "$mod" || fails=$((fails+1))
            echo "::endgroup::"
          done
          exit $fails

  shopbot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - name: Import check
        env:
          SHOP_BOT_TOKEN: "123:ci"
          API_BASE_URL: http://localhost:8000
          SHOP_BOT_API_KEY: ci
        run: python -c "import bot"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck + build
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build
