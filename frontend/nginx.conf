server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite's build hashes every filename under /assets/ (e.g.
    # FinancePage-BvQaeIAC.js) — safe to cache forever, since a content
    # change always gets a new filename, never the same URL with different
    # bytes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html references those hashed filenames by name, so it must
    # never be cached — otherwise a tab left open across a deploy keeps
    # asking for a JS chunk the last build already replaced, and lazy-loaded
    # routes (dynamic import()) fail with "Failed to fetch dynamically
    # imported module" instead of just picking up the new build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
