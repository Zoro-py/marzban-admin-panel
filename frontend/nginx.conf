server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip: the main JS bundle is ~484KB raw (~130KB gzipped). A mobile
    # client on a throttled route loads the HTML and CSS but the big bundle
    # never finishes and the app shows a blank screen — observed live
    # 2026-10-01 (Android, Irancell, assets stalling at 86KB+ while the
    # 484KB index chunk never arrived). Hashed assets are immutable so a
    # fixed level is safe; text/html is compressed by default and woff2 is
    # already compressed, so neither is listed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Vite's build hashes every filename under /assets/ (e.g.
    # FinancePage-BvQaeIAC.js) — safe to cache forever, since a content
    # change always gets a new filename, never the same URL with different
    # bytes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html references those hashed filenames by name, so it must
    # never be cached — otherwise a tab left open across a deploy keeps
    # asking for a JS chunk the last build already replaced, and lazy-loaded
    # routes (dynamic import()) fail with "Failed to fetch dynamically
    # imported module" instead of just picking up the new build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
