services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: sqlite:////app/data/vpn.db
      # In the volume, not the image layer: otherwise every rebuild mints a
      # new signing secret and logs every session out.
      JWT_SECRET_FILE: /app/data/.jwt_secret
    volumes:
      - backend_data:/app/data
    ports:
      # BIND_ADDRESS=127.0.0.1 (the installer sets it) keeps the API reachable
      # only through the host's nginx. Left unset it listens on every
      # interface, which the IP-only setup in .env.example relies on.
      - "${BIND_ADDRESS:-0.0.0.0}:8010:8000"
    restart: unless-stopped

  bot:
    build: ./bot
    env_file: ./bot/.env
    depends_on:
      - backend
    restart: unless-stopped

  # Customer-facing shop bot. A SEPARATE process and a separate Telegram
  # token from `bot` above on purpose: `bot` is locked to one chat id because
  # every command it has moves money, and this one has to accept anyone. It
  # also holds only SHOP_BOT_API_KEY, never the Marzban admin credentials —
  # see backend/app/routers/shop.py for why that split matters.
  # Remove this service if you aren't running a self-serve shop; nothing else
  # depends on it.
  shopbot:
    build: ./shopbot
    env_file: ./shopbot/.env
    environment:
      # Overrides whatever is in shopbot/.env: inside this network the backend
      # is reachable by service name, never on the bot's own loopback.
      API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${PUBLIC_BACKEND_URL}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:8011:80"
    restart: unless-stopped

volumes:
  backend_data:
